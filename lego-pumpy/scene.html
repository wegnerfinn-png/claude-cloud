<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Pumpy LEGO Scene</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/Inter-SemiBold.woff2") format("woff2"); }
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------------------
// Pumpy "Calories in LEGO" — deterministic scene. window.render(t) draws frame t.
// ---------------------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

// Seeded RNG so every render is identical.
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

// ---- Story ----------------------------------------------------------------
// 20 x 20 grid = 400 studs, so 1 % = 4 studs.
const COLS = 20, ROWS = 20;
const REGIONS = [
  { key: "bmr",  pct: 65, color: "#E4CD9E", label: "65 % just keeps you alive." },
  { key: "neat", pct: 20, color: "#4B9F4A", label: "20 % is walking & fidgeting," },
  { key: "tef",  pct: 10, color: "#FE8A18", label: "10 % is digesting food," },
  { key: "gym",  pct: 5,  color: "#C91A09", label: "and your workout? Only 5 %." },
];
// Timeline (seconds). fill = [start, end] of brick placement for each region.
const TIMELINE = {
  duration: 10,
  intro: { caption: "Every calorie you burn in a day:", from: 0.25, to: 2.0 },
  regions: {
    bmr:  { fill: [2.05, 4.35], cap: [2.0, 4.6] },
    neat: { fill: [4.65, 6.15], cap: [4.6, 6.6] },
    tef:  { fill: [6.65, 7.55], cap: [6.6, 8.0] },
    gym:  { fill: [8.30, 8.80], cap: [8.0, 10.0] },
  },
};

// ---- Geometry ---------------------------------------------------------------
const P = 37;                       // stud pitch on the grey plate
const GX = Math.round((W - COLS * P) / 2), GY = 575;
const BP = 24.5;                    // stud pitch on the blue baseplate
const BASE = { x: -10, y: 372, w: W + 20, h: 1130 };

// ---- Brick layout -----------------------------------------------------------
// Fill bottom-up, row by row. Each region becomes bands of 2-row or 1-row bricks.
const bricks = [];
(function layout() {
  const r = rng(7);
  let row = ROWS - 1;                // current bottom row being filled
  for (const reg of REGIONS) {
    let rowsLeft = (reg.pct * 4) / COLS;   // all regions are whole rows
    const regBricks = [];
    let band = 0;
    while (rowsLeft > 0) {
      const h = rowsLeft >= 2 ? 2 : 1;
      const top = row - h + 1;
      let x = 0;
      const lens = h === 2 ? [2, 3, 4, 4] : [2, 3, 4, 6];
      // stagger seams: odd bands start with a short brick
      if (band % 2 === 1) { regBricks.push({ c: 0, r: top, w: 2, h }); x = 2; }
      while (x < COLS) {
        let w = lens[Math.floor(r() * lens.length)];
        if (x + w > COLS) w = COLS - x;
        if (COLS - (x + w) === 1) w += 1;  // avoid 1-stud leftovers
        regBricks.push({ c: x, r: top, w, h });
        x += w;
      }
      row -= h; rowsLeft -= h; band++;
    }
    // placement order: bottom band first, left to right with a little jitter
    regBricks.sort((a, b) => (b.r - a.r) || (a.c - b.c));
    const [t0, t1] = TIMELINE.regions[reg.key].fill;
    const n = regBricks.length;
    regBricks.forEach((b, i) => {
      b.color = reg.color; b.region = reg.key;
      b.t = t0 + (n === 1 ? 0 : (i / (n - 1)) * (t1 - t0 - 0.25)) + (r() - 0.5) * 0.04;
      b.rot = (r() - 0.5) * 0.12;
      bricks.push(b);
    });
  }
})();
const DROP = 0.26;                   // seconds a brick takes to land
window.landTimes = bricks.map(b => +(b.t + DROP).toFixed(3));

// ---- Colour helpers ---------------------------------------------------------
function shade(hex, f) {             // f>0 lighten, f<0 darken
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return `rgb(${r},${g},${b})`;
}

// ---- Stud sprites -----------------------------------------------------------
const studCache = new Map();
function studSprite(color, pitch) {
  const key = color + pitch;
  if (studCache.has(key)) return studCache.get(key);
  const s = Math.ceil(pitch), c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d"), cx = s / 2, cy = s / 2, rad = pitch * 0.31;
  // cast shadow (light from top-left)
  g.fillStyle = "rgba(0,0,0,0.28)";
  g.beginPath(); g.ellipse(cx + pitch * 0.07, cy + pitch * 0.09, rad * 1.02, rad * 1.02, 0, 0, 7); g.fill();
  // side wall
  g.fillStyle = shade(color, -0.22);
  g.beginPath(); g.arc(cx + pitch * 0.02, cy + pitch * 0.035, rad, 0, 7); g.fill();
  // top face
  const gr = g.createRadialGradient(cx - rad * 0.4, cy - rad * 0.5, rad * 0.1, cx, cy, rad * 1.1);
  gr.addColorStop(0, shade(color, 0.28)); gr.addColorStop(0.7, color); gr.addColorStop(1, shade(color, -0.06));
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx - pitch * 0.01, cy - pitch * 0.015, rad * 0.94, 0, 7); g.fill();
  // rim highlight
  g.strokeStyle = "rgba(255,255,255,0.45)"; g.lineWidth = Math.max(1, pitch * 0.035);
  g.beginPath(); g.arc(cx - pitch * 0.01, cy - pitch * 0.015, rad * 0.86, Math.PI * 1.05, Math.PI * 1.7); g.stroke();
  studCache.set(key, c);
  return c;
}

// ---- Static layers (rendered once) -----------------------------------------
function makeConcrete() {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), r = rng(42);
  g.fillStyle = "#b7babb"; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {         // mottling, mostly small patches
    const x = r() * W, y = r() * H, rad = 8 + Math.pow(r(), 2.5) * 120, a = 0.03 + r() * 0.06;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    const v = r() < 0.5 ? "70,72,74" : "235,236,236";
    gr.addColorStop(0, `rgba(${v},${a})`); gr.addColorStop(1, `rgba(${v},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const img = g.getImageData(0, 0, W, H), d = img.data;   // fine grain + pores
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * 26 + (r() < 0.006 ? -55 : 0) + (r() < 0.003 ? 35 : 0);
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  return c;
}

function makeBaseplate() {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 18; g.shadowOffsetY = 6;
  g.fillStyle = "#1E5AA8"; g.fillRect(BASE.x, BASE.y, BASE.w, BASE.h);
  g.shadowColor = "transparent";
  const sp = studSprite("#1E5AA8", BP);
  for (let y = BASE.y + BP * 0.15; y < BASE.y + BASE.h - BP * 0.8; y += BP)
    for (let x = BASE.x + 4; x < BASE.x + BASE.w - BP * 0.5; x += BP) g.drawImage(sp, x, y);
  // grey plate the bricks sit on
  const px = GX - 6, py = GY - 6, pw = COLS * P + 12, ph = ROWS * P + 12;
  g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 8; g.shadowOffsetX = 3; g.shadowOffsetY = 5;
  g.fillStyle = "#A0A5A9"; g.fillRect(px, py, pw, ph);
  g.shadowColor = "transparent";
  const gs = studSprite("#A0A5A9", P);
  for (let r = 0; r < ROWS; r++) for (let cI = 0; cI < COLS; cI++) g.drawImage(gs, GX + cI * P, GY + r * P);
  return c;
}

// ---- Brick drawing ----------------------------------------------------------
function drawBrick(b, lift) {
  const x = GX + b.c * P, y = GY + b.r * P, w = b.w * P, h = b.h * P;
  const s = 1 + 0.16 * lift;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  // shadow grows/softens with height
  ctx.save();
  ctx.translate(10 * lift + 2, 16 * lift + 3);
  ctx.fillStyle = `rgba(0,0,0,${0.30 - 0.12 * lift})`;
  if (lift > 0) {
    // draw only the blurred shadow: the rect itself sits off-canvas
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 4 + 14 * lift; ctx.shadowOffsetX = 10000 * ctx.getTransform().a; // offsets ignore the transform
    ctx.fillRect(-w / 2 - 10000, -h / 2, w, h);
  } else ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.restore();
  ctx.rotate(b.rot * lift);
  ctx.scale(s, s);
  // body
  ctx.fillStyle = b.color; ctx.fillRect(-w / 2, -h / 2, w, h);
  // bevel edges
  ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fillRect(-w / 2, -h / 2, w, 2.5); ctx.fillRect(-w / 2, -h / 2, 2.5, h);
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(-w / 2, h / 2 - 2.5, w, 2.5); ctx.fillRect(w / 2 - 2.5, -h / 2, 2.5, h);
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1; ctx.strokeRect(-w / 2 + 0.5, -h / 2 + 0.5, w - 1, h - 1);
  const sp = studSprite(b.color, P);
  for (let r = 0; r < b.h; r++) for (let cI = 0; cI < b.w; cI++) ctx.drawImage(sp, -w / 2 + cI * P, -h / 2 + r * P);
  ctx.restore();
}

// ---- Caption ----------------------------------------------------------------
function caption(text, alpha, pop) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '600 50px "Inter", "DejaVu Sans", sans-serif';
  const tw = ctx.measureText(text).width, padX = 26, bh = 82;
  const cx = W / 2, cy = GY + ROWS * P / 2;
  ctx.translate(cx, cy); ctx.scale(pop, pop);
  ctx.fillStyle = "#0F6F73";
  ctx.beginPath(); ctx.roundRect(-tw / 2 - padX, -bh / 2, tw + padX * 2, bh, 14); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 0, 3);
  ctx.restore();
}
function capState(t, from, to) {
  const fi = Math.min(1, (t - from) / 0.12), fo = Math.min(1, (to - t) / 0.08);
  const a = Math.max(0, Math.min(fi, fo));
  const pop = 0.94 + 0.06 * Math.min(1, Math.max(0, (t - from) / 0.15));
  return [t >= from && t <= to ? a : 0, pop];
}

// ---- Easing -----------------------------------------------------------------
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

// ---- Frame ------------------------------------------------------------------
let concrete, baseplate;
window.render = function (t) {
  // gentle push-in like a handheld top-down shot
  const z = 1 + 0.035 * Math.min(1, t / TIMELINE.duration);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(concrete, 0, 0);
  ctx.drawImage(baseplate, 0, 0);

  const landed = [], flying = [];
  for (const b of bricks) {
    if (t < b.t) continue;
    const k = (t - b.t) / DROP;
    if (k >= 1) landed.push(b); else flying.push([b, k]);
  }
  for (const b of landed) drawBrick(b, 0);
  for (const [b, k] of flying) {
    const e = easeOutCubic(k);
    ctx.save(); ctx.globalAlpha = Math.min(1, k * 4);
    drawBrick(b, 1 - e);
    ctx.restore();
  }

  // the 5 % workout row gets a pulse so the punchline lands
  const gym = TIMELINE.regions.gym.fill[1] + DROP;
  if (t > gym && t < gym + 1.2) {
    const p = (t - gym) / 1.2, a = Math.sin(p * Math.PI) * 0.9;
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 6;
    ctx.strokeRect(GX - 4, GY - 4, COLS * P + 8, P + 8);
    ctx.restore();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const I = TIMELINE.intro;
  caption(I.caption, ...capState(t, I.from, I.to));
  for (const reg of REGIONS) {
    const [a, b] = TIMELINE.regions[reg.key].cap;
    caption(reg.label, ...capState(t, a, b));
  }
};

window.ready = (async () => {
  await document.fonts.load('600 50px "Inter"');
  concrete = makeConcrete();
  baseplate = makeBaseplate();
  render(0);
  return { duration: TIMELINE.duration, landTimes: window.landTimes };
})();
</script>
</body>
</html>
